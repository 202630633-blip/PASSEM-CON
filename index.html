<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>노래 추천 사이트</title>
  <!-- CSS 파일 연결 -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>🎵 나만의 노래 추천 사이트</h1>
  
  <!-- [노래 고르기] 메인 버튼 -->
  <button class="main-btn" onclick="toggleGenres()">[노래 고르기]</button>

  <!-- 장르 버튼 영역 (초기에는 숨김) -->
  <div id="genre-container" class="hidden">
    <button class="genre-btn" onclick="showSongs('kpop')">K-POP</button>
    <button class="genre-btn" onclick="showSongs('pop')">POP</button>
    <button class="genre-btn" onclick="showSongs('classic')">Classic</button>
    <button class="genre-btn" onclick="showSongs('funk')">Funk/Phonk</button>
  </div>

  <!-- 노래 목록이 보여질 영역 -->
  <div id="song-list"></div>

  <!-- JavaScript 파일 연결 -->
  <script src="script.js"></script>
</body>
</html>
